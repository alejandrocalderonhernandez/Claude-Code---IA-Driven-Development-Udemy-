spring:
  application:
    name: JobBoardAPI
  datasource:
    url: jdbc:postgresql://localhost:5432/jobboard
    username: app
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

candidate:
  service:
    base-url: https://jsonplaceholder.typicode.com
